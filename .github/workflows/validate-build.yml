name: Validate build tooling

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'build.sh'
      - 'version.properties'
      - '.gitignore'
      - 'README.md'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'build.sh'
      - 'version.properties'
      - '.gitignore'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-build-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n ./build.sh

      - name: Check version extraction
        shell: bash
        run: |
          set -euo pipefail
          version="$(bash ./build.sh --print-version)"
          [[ -n "$version" ]]
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]]

      - name: Dry-run both image builds
        shell: bash
        run: |
          set -euo pipefail
          bash ./build.sh --dry-run --registry ghcr.io --image-namespace esupportail
